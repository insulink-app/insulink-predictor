[project]
name = "insulink-predictor"
version = "0.1.0"
description = "Event-triggered glucose forecasting engine — beat persistence, don't just predict glucose."
readme = "README.md"
authors = [
    { name = "Lukas Breuer", email = "contact@lukasbreuer.de" },
    { name = "Miguel Cortina Zapp", email = "miguel@stundio.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "methcomp>=1.0",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "pyarrow>=16.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "joblib>=1.3",
]

[project.scripts]
gf = "insulink_predictor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

# Distribution is named "insulink-predictor", but the ROADMAP (§2) mandates the
# importable package + CLI live under `insulink_predictor`. Pin the module name so
# both hold.
[tool.uv.build-backend]
module-name = "insulink_predictor"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
